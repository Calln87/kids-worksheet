    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickItem(arr) {
      return arr[rand(0, arr.length - 1)];
    }

    function pickActualOp(opMode) {
      if (['add', 'sub', 'mul', 'div'].includes(opMode)) return opMode;
      if (opMode === 'mix_md') return (Math.random() < 0.5) ? 'mul' : 'div';
      if (opMode === 'mix_all') return ['add', 'sub', 'mul', 'div'][rand(0, 3)];
      return (Math.random() < 0.5) ? 'add' : 'sub';
    }

    // 🔢 수학 Lv.1 ~ Lv.20 문제 생성
    function generateMathProblem(level, opMode) {
      const lv = Number(level);
      const actualOp = pickActualOp(opMode);

      // 곱셈/나눗셈 선택 시 레벨별 맞춤 구구단/나눗셈 생성
      if (actualOp === 'mul' || actualOp === 'div') {
        const isDiv = (actualOp === 'div');
        let f1 = 2, f2 = 2;
        if (lv <= 2) { f1 = rand(1, 3); f2 = rand(1, 3); }
        else if (lv <= 5) { f1 = [2, 3, 5][rand(0, 2)]; f2 = rand(1, 5); }
        else if (lv <= 8) { f1 = rand(2, 4); f2 = rand(2, 6); }
        else if (lv <= 11) { f1 = rand(2, 5); f2 = rand(2, 7); }
        else if (lv <= 14) { f1 = rand(3, 7); f2 = rand(3, 8); }
        else if (lv <= 17) { f1 = rand(5, 9); f2 = rand(3, 9); }
        else { f1 = rand(6, 10); f2 = rand(3, 10); }

        const prod = f1 * f2;
        if (lv === 20) {
          return !isDiv
            ? { subject: 'math', a: f1, b: f2, op: '×', ans: String(f2), target: prod, type: 'blank_right' }
            : { subject: 'math', a: prod, b: f1, op: '÷', ans: String(f1), target: f2, type: 'blank_right' };
        }
        return !isDiv
          ? { subject: 'math', a: f1, b: f2, op: '×', ans: String(prod), type: 'normal' }
          : { subject: 'math', a: prod, b: f1, op: '÷', ans: String(f2), type: 'normal' };
      }

      const isSub = (actualOp === 'sub');
      let a = 1, b = 1;

      switch (lv) {
        case 1: // 1~5 덧셈/뺄셈
          if (!isSub) { a = rand(1, 4); b = rand(1, 5 - a); }
          else { a = rand(2, 5); b = rand(1, a - 1); }
          break;
        case 2: // 1~5 가르기
          if (opMode === 'add') { a = rand(1, 4); b = rand(1, 5 - a); }
          else { a = rand(2, 5); b = rand(1, a - 1); return { subject: 'math', a, b, op: '-', ans: String(a - b), type: 'normal' }; }
          break;
        case 3: // 6~10 모으기
          if (!isSub) { a = rand(2, 7); b = rand(2, 10 - a); }
          else { a = rand(6, 10); b = rand(1, a - 2); }
          break;
        case 4: // 6~10 빼기
          if (opMode === 'add') { a = rand(3, 7); b = rand(2, 10 - a); }
          else { a = rand(6, 10); b = rand(2, a - 1); return { subject: 'math', a, b, op: '-', ans: String(a - b), type: 'normal' }; }
          break;
        case 5: // 10의 보수
          a = rand(1, 9); b = 10 - a;
          if (!isSub) {
            return { subject: 'math', a, b, op: '+', ans: String(b), target: 10, type: 'blank_right' };
          } else {
            return { subject: 'math', a: 10, b: a, op: '-', ans: String(b), type: 'normal' };
          }
        case 6: // 받아올림 없는 십몇 + 한 자리
          if (!isSub) { const o = rand(1, 6); a = 10 + o; b = rand(1, 9 - o); }
          else { const o = rand(3, 9); a = 10 + o; b = rand(1, o - 1); }
          break;
        case 7: // 받아내림 없는 십몇 - 한 자리
          if (opMode === 'add') { const o = rand(1, 7); a = 10 + o; b = rand(1, 9 - o); }
          else { const o = rand(3, 9); a = 10 + o; b = rand(1, o - 1); return { subject: 'math', a, b, op: '-', ans: String(a - b), type: 'normal' }; }
          break;
        case 8: // 20 이하 받아올림 덧셈
          if (opMode === 'sub') { a = rand(11, 18); b = rand(Math.max(2, a - 9), 9); }
          else { a = rand(4, 9); b = rand(11 - a, 9); return { subject: 'math', a, b, op: '+', ans: String(a + b), type: 'normal' }; }
          break;
        case 9: // 20 이하 받아내림 뺄셈
          if (opMode === 'add') { a = rand(5, 9); b = rand(11 - a, 9); }
          else { a = rand(11, 18); b = rand(Math.max(2, a - 9), 9); return { subject: 'math', a, b, op: '-', ans: String(a - b), type: 'normal' }; }
          break;
        case 10: // 20 이하 종합
          if (!isSub) { a = rand(5, 13); b = rand(3, 20 - a); }
          else { a = rand(11, 20); b = rand(3, a - 2); }
          break;
        case 11: // 30 이하 두 자리와 한 자리
          if (!isSub) { a = rand(12, 24); b = rand(2, 30 - a); }
          else { a = rand(15, 30); b = rand(2, 9); }
          break;
        case 12: // 50 이하 받아올림/내림 없는 두 자리 연산
          if (!isSub) {
            const t1 = rand(1, 2), o1 = rand(1, 5);
            const t2 = rand(1, 4 - t1), o2 = rand(1, 9 - o1);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          } else {
            const t1 = rand(2, 4), o1 = rand(3, 9);
            const t2 = rand(1, t1 - 1), o2 = rand(1, o1 - 1);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          }
          break;
        case 13: // 50 이하 받아올림/내림 있는 두 자리 연산
          if (!isSub) {
            const t1 = rand(1, 2), o1 = rand(5, 9);
            const t2 = rand(1, 3 - t1), o2 = rand(10 - o1, 9);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          } else {
            const t1 = rand(2, 4), o1 = rand(1, 5);
            const t2 = rand(1, t1 - 1), o2 = rand(o1 + 1, 9);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          }
          break;
        case 14: // 몇십 + 몇십 / 몇십 - 몇십
          if (!isSub) {
            const t1 = rand(1, 8), t2 = rand(1, 10 - t1);
            a = t1 * 10; b = t2 * 10;
          } else {
            const t1 = rand(2, 10), t2 = rand(1, t1 - 1);
            a = t1 * 10; b = t2 * 10;
          }
          break;
        case 15: // 100 이하 받아올림 없는 두 자리 연산
          if (!isSub) {
            const t1 = rand(2, 6), o1 = rand(1, 5);
            const t2 = rand(1, 9 - t1), o2 = rand(1, 9 - o1);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          } else {
            const t1 = rand(3, 9), o1 = rand(3, 9);
            const t2 = rand(1, t1 - 1), o2 = rand(1, o1 - 1);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
          }
          break;
        case 16: // 100 이하 받아올림 두 자리 덧셈
          if (opMode === 'sub') { a = rand(42, 98); b = rand(15, a - 12); }
          else {
            const t1 = rand(1, 6), o1 = rand(4, 9);
            const t2 = rand(1, 8 - t1), o2 = rand(10 - o1, 9);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
            return { subject: 'math', a, b, op: '+', ans: String(a + b), type: 'normal' };
          }
          break;
        case 17: // 100 이하 받아내림 두 자리 뺄셈
          if (opMode === 'add') { a = rand(24, 68); b = rand(15, 100 - a); }
          else {
            const t1 = rand(3, 9), o1 = rand(1, 6);
            const t2 = rand(1, t1 - 1), o2 = rand(o1 + 1, 9);
            a = t1 * 10 + o1; b = t2 * 10 + o2;
            return { subject: 'math', a, b, op: '-', ans: String(a - b), type: 'normal' };
          }
          break;
        case 18: // 100 이하 종합
          if (!isSub) { a = rand(15, 72); b = rand(12, 100 - a); }
          else { a = rand(35, 100); b = rand(12, a - 10); }
          break;
        case 19: { // 세 수의 연쇄 연산 (넘버블럭스 3캐릭터)
          if (!isSub) {
            const c1 = rand(2, 12), c2 = rand(2, 12), c3 = rand(2, 12);
            return { subject: 'math', a: c1, b: c2, c: c3, op1: '+', op2: '+', ans: String(c1 + c2 + c3), type: 'triple' };
          } else {
            const c1 = rand(12, 28), c2 = rand(2, 7), c3 = rand(2, 6);
            return { subject: 'math', a: c1, b: c2, c: c3, op1: '-', op2: '-', ans: String(c1 - c2 - c3), type: 'triple' };
          }
        }
        case 20:
        default: { // 미지수 빈칸 추론 마스터
          if (!isSub) {
            a = rand(12, 65); b = rand(11, 100 - a);
            return { subject: 'math', a, b, op: '+', ans: String(b), target: a + b, type: 'blank_right' };
          } else {
            a = rand(32, 100); b = rand(11, a - 10);
            return { subject: 'math', a, b, op: '-', ans: String(b), target: a - b, type: 'blank_right' };
          }
        }
      }

      const opChar = isSub ? '-' : '+';
      const ansVal = isSub ? (a - b) : (a + b);
      return { subject: 'math', a, b, op: opChar, ans: String(ansVal), type: 'normal' };
    }

    // 🔤 영어(알파블럭스) Lv.1 ~ Lv.20 문제 생성
    function generateEngProblem(level, engMode) {
      const lv = Number(level);
      const isTrace = (engMode === 'eng_trace');

      // Lv.1 ~ Lv.4: 알파벳 대·소문자 짝꿍 찾기
      if (lv >= 1 && lv <= 4) {
        const ranges = { 1: 'ABCDEFG', 2: 'HIJKLMN', 3: 'OPQRSTU', 4: 'VWXYZ' };
        const pool = ranges[lv];
        const ch = pool[rand(0, pool.length - 1)];
        const lower = ch.toLowerCase();
        return {
          subject: 'eng',
          type: 'letter_pair',
          chars: [ch, lower],
          promptLeft: `${ch} 의 짝꿍 소문자 →`,
          ans: lower,
          meaning: `알파블럭스 ${ch} · ${lower}`,
          trace: isTrace
        };
      }

      // Lv.5: 알파벳 A~Z 순서 빈칸 추론 (A - [ B ] - C)
      if (lv === 5) {
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const idx = rand(0, 23);
        const c1 = alphabet[idx], c2 = alphabet[idx + 1], c3 = alphabet[idx + 2];
        return {
          subject: 'eng',
          type: 'seq_blank',
          chars: [c1, c2, c3],
          seq: [c1, null, c3],
          ans: c2,
          meaning: '알파벳 순서 맞추기',
          trace: isTrace
        };
      }

      // Lv.16: 숫자 영단어 (넘버블럭스 × 알파블럭스 콜라보!)
      if (lv === 16) {
        const item = pickItem(WORD_BANKS.numbers_eng);
        const w = item.w;
        const blankIdx = (engMode === 'eng_first') ? 0 : (engMode === 'eng_last' ? w.length - 1 : rand(0, w.length - 1));
        return {
          subject: 'eng',
          type: 'number_word',
          num: item.num,
          word: w,
          blankIdx,
          ans: w[blankIdx],
          meaning: item.m,
          trace: isTrace
        };
      }

      // Lv.18: 알파블럭스 애너그램 (철자 순서 맞추기)
      if (lv === 18) {
        const pool = [...WORD_BANKS.cvc_a, ...WORD_BANKS.cvc_ei, ...WORD_BANKS.cvc_ou];
        const item = pickItem(pool);
        const w = item.w;
        const scrambled = w.split('').reverse().join(' · ');
        return {
          subject: 'eng',
          type: 'whole_word',
          chars: w.split(''),
          promptText: `[ ${scrambled} ] →`,
          ans: w,
          meaning: item.m,
          trace: isTrace
        };
      }

      // Lv.19: 반대말 완성
      if (lv === 19) {
        const item = pickItem(WORD_BANKS.opposites);
        const w = item.w;
        const blankIdx = rand(0, w.length - 1);
        return {
          subject: 'eng',
          type: 'word_blank',
          chars: w.slice(0, 3).split(''),
          prefix: item.q,
          word: w,
          blankIdx,
          ans: w[blankIdx],
          meaning: item.m,
          trace: isTrace
        };
      }

      // Lv.20: 기초 영어 문장 빈칸 완성
      if (lv === 20) {
        const item = pickItem(WORD_BANKS.sentences);
        return {
          subject: 'eng',
          type: 'sentence_blank',
          chars: item.w.slice(0, 3).split(''),
          pre: item.pre,
          post: item.post,
          ans: item.w,
          meaning: item.m,
          trace: isTrace
        };
      }

      // Lv.6 ~ Lv.15, Lv.17: 파닉스 및 영단어 스펠링 블렌딩
      let bank = WORD_BANKS.cvc_a;
      if (lv === 6) bank = [...WORD_BANKS.cvc_a, ...WORD_BANKS.cvc_ei, ...WORD_BANKS.cvc_ou];
      else if (lv === 7) bank = WORD_BANKS.cvc_a;
      else if (lv === 8) bank = WORD_BANKS.cvc_ei;
      else if (lv === 9) bank = WORD_BANKS.cvc_ou;
      else if (lv === 10) bank = [...WORD_BANKS.cvc_a, ...WORD_BANKS.cvc_ou];
      else if (lv === 11) bank = WORD_BANKS.digraph;
      else if (lv === 12) bank = WORD_BANKS.blends;
      else if (lv === 13) bank = WORD_BANKS.magic_e;
      else if (lv === 14) bank = WORD_BANKS.vowel_team;
      else if (lv === 15) bank = WORD_BANKS.animals;
      else if (lv === 17) bank = WORD_BANKS.colors_fruits;

      const item = pickItem(bank);
      const w = item.w;
      let blankIdx = 0;
      if (lv === 6 || engMode === 'eng_first') blankIdx = 0;
      else if (lv === 10 || engMode === 'eng_last') blankIdx = w.length - 1;
      else if ((lv >= 7 && lv <= 9) || engMode === 'eng_vowel') blankIdx = 1;
      else blankIdx = rand(0, w.length - 1);

      return {
        subject: 'eng',
        type: 'word_blank',
        chars: w.slice(0, 3).split(''),
        word: w,
        blankIdx,
        ans: w[blankIdx],
        meaning: item.m,
        trace: isTrace
      };
    }

    /* =====================================================================
       4. UI 상태 관리, 과목 전환, 렌더링 및 오답노트/채점 시스템
       ===================================================================== */
    let currentSubject = 'math'; // 'math' | 'eng'
    let currentProblems = [];
    let wrongProblems = [];

    function populateSelectors() {
      const levelSelect = document.getElementById('levelSelect');
      const opSelect = document.getElementById('opSelect');
      const prevLevel = levelSelect.value || '2';

      levelSelect.innerHTML = '';
      const levelsMap = (currentSubject === 'math') ? MATH_LEVELS : ENG_LEVELS;
      for (let i = 1; i <= 20; i++) {
        const opt = document.createElement('option');
        opt.value = String(i);
        opt.textContent = levelsMap[i];
        if (String(i) === prevLevel) opt.selected = true;
        levelSelect.appendChild(opt);
      }

      opSelect.innerHTML = '';
      if (currentSubject === 'math') {
        const mathOps = [
          { v: 'mix', t: '덧셈·뺄셈 혼합 (+/-)' },
          { v: 'add', t: '덧셈 집중 (+)' },
          { v: 'sub', t: '뺄셈 집중 (-)' },
          { v: 'mul', t: '곱셈 집중 (×)' },
          { v: 'div', t: '나눗셈 집중 (÷)' },
          { v: 'mix_md', t: '곱셈·나눗셈 혼합 (×/÷)' },
          { v: 'mix_all', t: '사칙연산 전체 혼합' }
        ];
        mathOps.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.v;
          opt.textContent = o.t;
          opSelect.appendChild(opt);
        });
      } else {
        const engOps = [
          { v: 'eng_all', t: '파닉스·스펠링 빈칸 (표준)' },
          { v: 'eng_trace', t: '따라쓰기 가이드 (Tracing)' },
          { v: 'eng_first', t: '첫소리(앞글자) 집중' },
          { v: 'eng_vowel', t: '모음(가운데 글자) 집중' },
          { v: 'eng_last', t: '끝소리(마지막 글자) 집중' }
        ];
        engOps.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.v;
          opt.textContent = o.t;
          opSelect.appendChild(opt);
        });
      }
    }

    /* =====================================================================
       4-B. 태블릿 펜 필기(Stylus/Touch Canvas) 엔진
       ===================================================================== */
    let isPenMode = true;          // 기본값: 태블릿 펜 쓰기 모드 활성화 (키보드 팝업 차단)
    let penTool = 'draw';          // 'draw' | 'eraser'
    let penColor = '#0F172A';      // 기본 검정색
    let penSize = 4.5;             // 기본 굵기
    let scratchModeActive = false; // 여백 자유 풀이펜 토글
    let zoomPadEnabled = false;    // 빈칸 터치 시 크게 쓰기 패드 자동 열기 토글
    let activeAnswerBox = null;    // 현재 크게 쓰기 패드와 연결된 .answer-box

    // 정답 박스 공통 HTML 빌더 (키보드 input + 태블릿 펜 canvas + 개별 지우개 + 정답 힌트)
    function buildAnswerBoxHTML(ans, opts = {}) {
      const extraClass = opts.extraClass || '';
      const styleAttr = opts.style ? `style="${opts.style}"` : '';
      const maxLen = opts.maxLen || 3;
      const inputMode = opts.numeric ? 'inputmode="numeric"' : '';
      const traceClass = opts.trace ? 'trace-guide' : '';
      const cWidth = opts.wide ? 288 : 164;
      const cHeight = 136;

      return `
        <div class="answer-box ${extraClass}" ${styleAttr} data-ans="${ans}" data-has-ink="false">
          <input type="text" class="answer-input" data-ans="${ans}" maxlength="${maxLen}" ${inputMode} autocomplete="off">
          <canvas class="answer-canvas" width="${cWidth}" height="${cHeight}"></canvas>
          <button type="button" class="box-clear-btn" title="이 칸 다시 쓰기">×</button>
          <span class="answer-hint ${traceClass}">${ans}</span>
        </div>
      `;
    }

    // 개별 캔버스(정답 칸 / 이름 칸 / 여백 캔버스 / 확대 패드)에 부드러운 펜 드로잉 바인딩
    function bindCanvasDrawing(canvas, options = {}) {
      if (!canvas || canvas.dataset.bound === 'true') return;
      canvas.dataset.bound = 'true';

      const ctx = canvas.getContext('2d');
      let drawing = false;
      let lastX = 0;
      let lastY = 0;

      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || 1);
        const scaleY = canvas.height / (rect.height || 1);
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      function applyBrushSettings(e) {
        const rect = canvas.getBoundingClientRect();
        const resRatio = canvas.width / (rect.width || 1);
        const pressure = (e && e.pointerType === 'pen' && e.pressure > 0) ? (0.65 + e.pressure * 0.7) : 1;

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (penTool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = penSize * 4.2 * resRatio;
          ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.lineWidth = penSize * pressure * resRatio;
          ctx.strokeStyle = penColor;
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (!isPenMode) return;
        if (options.onlyPenOrScratch && e.pointerType !== 'pen' && !scratchModeActive) return;

        // 크게 쓰기 창 모드가 켜져 있고 일반 정답 칸을 터치한 경우 확대 창 오픈
        if (options.answerBox && zoomPadEnabled && !options.isZoomCanvas) {
          openZoomPadForBox(options.answerBox);
        }

        e.preventDefault();
        e.stopPropagation();
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        }

        drawing = true;
        const pt = getCanvasCoords(e);
        lastX = pt.x;
        lastY = pt.y;

        applyBrushSettings(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(lastX + 0.01, lastY + 0.01);
        ctx.stroke();

        if (options.answerBox && penTool !== 'eraser') {
          options.answerBox.dataset.hasInk = 'true';
          options.answerBox.classList.add('has-ink');
        }
        if (options.onStroke) options.onStroke();
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drawing || !isPenMode) return;
        e.preventDefault();
        e.stopPropagation();

        const pt = getCanvasCoords(e);
        applyBrushSettings(e);

        const midX = (lastX + pt.x) / 2;
        const midY = (lastY + pt.y) / 2;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.quadraticCurveTo(lastX, lastY, midX, midY);
        ctx.lineTo(pt.x, pt.y);
        ctx.stroke();

        lastX = pt.x;
        lastY = pt.y;

        if (options.onStroke) options.onStroke();
      });

      function endStroke(e) {
        if (!drawing) return;
        drawing = false;
        if (e && canvas.releasePointerCapture) {
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        if (options.onStroke) options.onStroke();
      }

      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);
      canvas.addEventListener('pointerleave', endStroke);
    }

    // 개별 정답 칸 지우기
    function clearAnswerBoxInk(box) {
      if (!box) return;
      const canvas = box.querySelector('.answer-canvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      box.dataset.hasInk = 'false';
      box.classList.remove('has-ink');
      const input = box.querySelector('.answer-input');
      if (input) input.value = '';

      if (activeAnswerBox === box) {
        const zoomCanvas = document.getElementById('zoomPadCanvas');
        if (zoomCanvas) {
          zoomCanvas.getContext('2d').clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
        }
      }
    }

    // 학습지 내 모든 손글씨 초기화
    function clearAllHandwriting() {
      document.querySelectorAll('.answer-box').forEach(box => clearAnswerBoxInk(box));
      const scratch = document.getElementById('sheetScratchCanvas');
      if (scratch) scratch.getContext('2d').clearRect(0, 0, scratch.width, scratch.height);
      const nameCanvas = document.getElementById('nameCanvas');
      if (nameCanvas) nameCanvas.getContext('2d').clearRect(0, 0, nameCanvas.width, nameCanvas.height);
      const zoomCanvas = document.getElementById('zoomPadCanvas');
      if (zoomCanvas) zoomCanvas.getContext('2d').clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
      document.body.classList.remove('grading-active');
      document.querySelectorAll('.problem-card').forEach(c => c.classList.remove('card-correct', 'card-wrong'));
      document.getElementById('scoreBanner').classList.remove('visible');
      playSoundEffect('pop');
    }

    // 확대 크게 쓰기 패드 열기 및 대상 정답 칸과 실시간 미러링
    function openZoomPadForBox(box) {
      activeAnswerBox = box;
      const modal = document.getElementById('zoomPadModal');
      const wrap = document.getElementById('zoomPadWrap');
      const zoomCanvas = document.getElementById('zoomPadCanvas');
      const zoomCtx = zoomCanvas.getContext('2d');
      const boxCanvas = box.querySelector('.answer-canvas');

      wrap.classList.toggle('eng-four-line-zoom', box.classList.contains('eng-four-line'));
      zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
      if (boxCanvas) {
        zoomCtx.drawImage(boxCanvas, 0, 0, zoomCanvas.width, zoomCanvas.height);
      }

      const card = box.closest('.problem-card');
      const probNum = card ? (parseInt(card.dataset.index, 10) + 1) : '';
      document.getElementById('zoomPadTitle').innerText = `✏️ ${probNum ? probNum + '번 문제 ' : ''}크게 쓰기 패드 (여기에 쓰면 정답 칸에 그대로 들어가요!)`;
      modal.classList.add('open');
    }

    function renderProblemCardDOM(prob, idx, count) {
      const card = document.createElement('div');
      card.className = 'problem-card';
      card.dataset.index = idx;

      const svgScale = (count === 4) ? 1.12 : (count === 5 ? 0.98 : 0.84);
      let visualHtml = '';
      let formulaHtml = '';

      if (prob.subject === 'math') {
        if (prob.type === 'triple') {
          visualHtml = `
            <div class="visual-area">
              ${buildNumberblockSVG(prob.a, svgScale * 0.8)}
              <span class="operator-icon">${prob.op1}</span>
              ${buildNumberblockSVG(prob.b, svgScale * 0.8)}
              <span class="operator-icon">${prob.op2}</span>
              ${buildNumberblockSVG(prob.c, svgScale * 0.8)}
            </div>
          `;
          formulaHtml = `
            <div class="formula-area">
              <span class="formula-text">${prob.a} ${prob.op1} ${prob.b} ${prob.op2} ${prob.c} =</span>
              ${buildAnswerBoxHTML(prob.ans, { numeric: true, maxLen: 3 })}
            </div>
          `;
        } else if (prob.type === 'blank_right') {
          visualHtml = `
            <div class="visual-area">
              ${buildNumberblockSVG(prob.a, svgScale)}
              <span class="operator-icon">${prob.op}</span>
              ${buildNumberblockSVG(prob.b, svgScale)}
            </div>
          `;
          formulaHtml = `
            <div class="formula-area">
              <span class="formula-text">${prob.a} ${prob.op}</span>
              ${buildAnswerBoxHTML(prob.ans, { extraClass: 'blank-middle', numeric: true, maxLen: 3 })}
              <span class="formula-text">= ${prob.target}</span>
            </div>
          `;
        } else {
          visualHtml = `
            <div class="visual-area">
              ${buildNumberblockSVG(prob.a, svgScale)}
              <span class="operator-icon">${prob.op}</span>
              ${buildNumberblockSVG(prob.b, svgScale)}
            </div>
          `;
          formulaHtml = `
            <div class="formula-area">
              <span class="formula-text">${prob.a} ${prob.op} ${prob.b} =</span>
              ${buildAnswerBoxHTML(prob.ans, { numeric: true, maxLen: 3 })}
            </div>
          `;
        }
      } else {
        // 영어 (알파블럭스) 카드 렌더링
        if (prob.type === 'number_word') {
          // Lv.16: 넘버블럭스 + 알파블럭스 콜라보!
          visualHtml = `
            <div class="visual-area">
              ${buildNumberblockSVG(prob.num, svgScale * 0.92)}
              <span class="operator-icon">=</span>
              ${buildAlphablockSVG(prob.word[0], svgScale * 0.92)}
            </div>
          `;
        } else {
          const charsToShow = (prob.chars || ['A', 'B']).slice(0, 3);
          visualHtml = `
            <div class="visual-area">
              ${charsToShow.map(c => buildAlphablockSVG(c, svgScale * 0.95)).join('')}
            </div>
          `;
        }

        if (prob.type === 'letter_pair') {
          formulaHtml = `
            <div class="formula-area">
              <div class="eng-word-box">
                <span class="eng-meaning-badge">${prob.meaning}</span>
                <div class="eng-letters-row">
                  <span class="formula-text" style="font-size:24px;">${prob.promptLeft}</span>
                  ${buildAnswerBoxHTML(prob.ans, { extraClass: 'eng-four-line', maxLen: 2, trace: prob.trace })}
                </div>
              </div>
            </div>
          `;
        } else if (prob.type === 'seq_blank') {
          formulaHtml = `
            <div class="formula-area">
              <div class="eng-word-box">
                <span class="eng-meaning-badge">${prob.meaning}</span>
                <div class="eng-letters-row">
                  <div class="letter-tile">${prob.seq[0]}</div>
                  <span class="operator-icon">→</span>
                  ${buildAnswerBoxHTML(prob.ans, { extraClass: 'eng-four-line', maxLen: 2, trace: prob.trace })}
                  <span class="operator-icon">→</span>
                  <div class="letter-tile">${prob.seq[2]}</div>
                </div>
              </div>
            </div>
          `;
        } else if (prob.type === 'whole_word' || prob.type === 'sentence_blank') {
          const leftLabel = (prob.type === 'sentence_blank') ? `${prob.pre}` : `${prob.promptText}`;
          const rightLabel = (prob.type === 'sentence_blank') ? `${prob.post}` : '';
          formulaHtml = `
            <div class="formula-area">
              <div class="eng-word-box">
                <span class="eng-meaning-badge">${prob.meaning}</span>
                <div class="eng-letters-row">
                  <span class="formula-text" style="font-size:23px;">${leftLabel}</span>
                  ${buildAnswerBoxHTML(prob.ans, { extraClass: 'eng-four-line eng-wide', maxLen: 8, trace: prob.trace, wide: true })}
                  ${rightLabel ? `<span class="formula-text" style="font-size:23px;">${rightLabel}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        } else {
          // word_blank / number_word (단어 내 글자 빈칸)
          const lettersHtml = prob.word.split('').map((ch, i) => {
            if (i === prob.blankIdx) {
              return buildAnswerBoxHTML(prob.ans, {
                extraClass: 'eng-four-line',
                style: 'width:64px; height:62px;',
                maxLen: 2,
                trace: prob.trace
              });
            }
            return `<div class="letter-tile">${ch}</div>`;
          }).join('');

          formulaHtml = `
            <div class="formula-area">
              <div class="eng-word-box">
                <span class="eng-meaning-badge">${prob.meaning}</span>
                <div class="eng-letters-row">
                  ${prob.prefix ? `<span class="formula-text" style="font-size:20px; margin-right:4px;">${prob.prefix}</span>` : ''}
                  ${lettersHtml}
                </div>
              </div>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="card-num">${idx + 1}</div>
        ${visualHtml}
        <div style="display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-end;">
          ${formulaHtml}
          <div class="pen-grade-ctrl">
            <button type="button" class="grade-ox-btn ox-o" data-ox="o" title="맞았어요">⭕</button>
            <button type="button" class="grade-ox-btn ox-x" data-ox="x" title="틀렸어요">❌</button>
          </div>
        </div>
      `;

      // 카드 내 정답 빈칸 캔버스 및 개별 지우기/O-X 판정 이벤트 바인딩
      const box = card.querySelector('.answer-box');
      if (box) {
        const canvas = box.querySelector('.answer-canvas');
        bindCanvasDrawing(canvas, { answerBox: box });

        const clearBtn = box.querySelector('.box-clear-btn');
        if (clearBtn) {
          clearBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearAnswerBoxInk(box);
          });
        }
      }

      card.querySelectorAll('.grade-ox-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const isO = btn.dataset.ox === 'o';
          card.querySelectorAll('.grade-ox-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          card.classList.toggle('card-correct', isO);
          card.classList.toggle('card-wrong', !isO);
          recalculateGradingSummary();
        });
      });

      return card;
    }

    function renderWorksheet(customList = null) {
      const level = document.getElementById('levelSelect').value || '2';
      const opMode = document.getElementById('opSelect').value;
      const count = parseInt(document.getElementById('countSelect').value, 10) || 5;
      const customTitle = document.getElementById('titleCustom').value.trim();

      // 헤더/태그 업데이트
      const brandTag = document.getElementById('brandTag');
      if (currentSubject === 'math') {
        brandTag.className = 'brand-tag';
        brandTag.innerHTML = '<span>●</span> NUMBERBLOCKS MATH (1~100 | Lv.1~Lv.20)';
        document.getElementById('displayTitle').innerText = customTitle || '넘버블럭스 수학 교실';
        document.getElementById('displaySubtitle').innerText = `${MATH_LEVELS[level] || ''}`;
      } else {
        brandTag.className = 'brand-tag eng-tag';
        brandTag.innerHTML = '<span>★</span> ALPHABLOCKS ENGLISH (A~Z | Lv.1~Lv.20)';
        document.getElementById('displayTitle').innerText = customTitle || '알파블럭스 영어 교실';
        document.getElementById('displaySubtitle').innerText = `${ENG_LEVELS[level] || ''}`;
      }

      // 배지 & 배너 & 여백 연습장 초기화
      const badge = document.getElementById('scoreBadge');
      badge.className = 'score-badge';
      badge.innerHTML = '참 잘했어요<br>⭐';
      document.getElementById('scoreBanner').classList.remove('visible');
      document.body.classList.remove('grading-active');
      const scratch = document.getElementById('sheetScratchCanvas');
      if (scratch) scratch.getContext('2d').clearRect(0, 0, scratch.width, scratch.height);

      const container = document.getElementById('problemsContainer');
      container.innerHTML = '';

      if (customList && customList.length > 0) {
        currentProblems = customList;
      } else {
        currentProblems = [];
        for (let i = 0; i < count; i++) {
          const p = (currentSubject === 'math')
            ? generateMathProblem(level, opMode)
            : generateEngProblem(level, opMode);
          currentProblems.push(p);
        }
      }

      currentProblems.forEach((prob, idx) => {
        const card = renderProblemCardDOM(prob, idx, currentProblems.length);
        container.appendChild(card);
      });

      fitA4ToScreen();
    }

    // 채점 요약 및 칭찬 도장/오답노트 업데이트
    function recalculateGradingSummary() {
      const cards = document.querySelectorAll('.problem-card');
      let correctCount = 0;
      wrongProblems = [];

      cards.forEach((card, idx) => {
        if (card.classList.contains('card-correct')) {
          correctCount++;
        } else {
          if (currentProblems[idx]) wrongProblems.push(currentProblems[idx]);
        }
      });

      const total = cards.length;
      const banner = document.getElementById('scoreBanner');
      const resultText = document.getElementById('scoreResultText');
      const retryBtn = document.getElementById('btnRetryWrong');
      const badge = document.getElementById('scoreBadge');

      banner.classList.add('visible');
      if (correctCount === total) {
        resultText.innerText = `🎉 만점이에요! ${total}문제 모두 정답! 최고예요!`;
        retryBtn.style.display = 'none';
        badge.className = 'score-badge stamped';
        badge.innerHTML = `100점!<br>👑 최고`;
        playSoundEffect('fanfare');
      } else {
        const penNotice = isPenMode ? ' (손글씨가 틀렸다면 카드 우측 ❌ 버튼을 눌러주세요)' : '';
        resultText.innerText = `📝 채점 결과: ${total}문제 중 ${correctCount}개 정답!${penNotice}`;
        retryBtn.style.display = 'inline-flex';
        badge.className = 'score-badge stamped';
        badge.innerHTML = `${correctCount}/${total}<br>👍 화이팅`;
        playSoundEffect('tryagain');
      }
    }

    // 즉시 채점하기 (키보드 자동 비교 + 태블릿 손글씨 채점 연동)
    function checkAnswers() {
      const cards = document.querySelectorAll('.problem-card');
      document.body.classList.add('grading-active');
      if (isPenMode) {
        document.body.classList.add('show-answers');
        document.getElementById('btnToggleAns').classList.add('active');
      }

      cards.forEach((card) => {
        const box = card.querySelector('.answer-box');
        const input = card.querySelector('.answer-input');
        if (!box || !input) return;

        const userVal = input.value.trim().toUpperCase();
        const expected = String(input.dataset.ans || '').trim().toUpperCase();
        const hasInk = box.dataset.hasInk === 'true';

        const btnO = card.querySelector('.ox-o');
        const btnX = card.querySelector('.ox-x');
        card.classList.remove('card-correct', 'card-wrong');
        if (btnO) btnO.classList.remove('selected');
        if (btnX) btnX.classList.remove('selected');

        let isCorrect = false;
        if (userVal !== '') {
          isCorrect = (userVal === expected);
        } else if (hasInk) {
          // 펜으로 손글씨를 작성한 경우 기본 ⭕로 표시하고 정답 힌트와 함께 즉시 대조 가능하게 지원
          isCorrect = true;
        }

        if (isCorrect) {
          card.classList.add('card-correct');
          if (btnO) btnO.classList.add('selected');
        } else {
          card.classList.add('card-wrong');
          if (btnX) btnX.classList.add('selected');
        }
      });

      recalculateGradingSummary();
    }

    // 과목 전환 핸들러
    function switchSubject(subj) {
      currentSubject = subj;
      const tabMath = document.getElementById('tabMath');
      const tabEng = document.getElementById('tabEng');
      const titleInput = document.getElementById('titleCustom');

      if (subj === 'math') {
        tabMath.className = 'tab-btn active-math';
        tabEng.className = 'tab-btn';
        if (titleInput.value === '알파블럭스 영어 교실') titleInput.value = '넘버블럭스 수학 교실';
      } else {
        tabMath.className = 'tab-btn';
        tabEng.className = 'tab-btn active-eng';
        if (titleInput.value === '넘버블럭스 수학 교실') titleInput.value = '알파블럭스 영어 교실';
      }

      populateSelectors();
      playSoundEffect('pop');
      renderWorksheet();
    }

    // 입력 모드 전환 (펜 쓰기 vs 키보드)
    function setInputMode(mode) {
      isPenMode = (mode === 'pen');
      document.body.classList.toggle('pen-mode', isPenMode);
      document.getElementById('btnModePen').classList.toggle('active', isPenMode);
      document.getElementById('btnModeKeyboard').classList.toggle('active', !isPenMode);
      if (!isPenMode) {
        document.getElementById('zoomPadModal').classList.remove('open');
      }
      playSoundEffect('pop');
    }

    function initDate() {
      const now = new Date();
      document.getElementById('currentDate').value = `${now.getMonth() + 1}월 ${now.getDate()}일`;
    }

    // 이벤트 바인딩
    document.getElementById('tabMath').addEventListener('click', () => switchSubject('math'));
    document.getElementById('tabEng').addEventListener('click', () => switchSubject('eng'));
    document.getElementById('btnGenerate').addEventListener('click', () => {
      playSoundEffect('pop');
      renderWorksheet();
    });
    document.getElementById('btnCheckScore').addEventListener('click', checkAnswers);
    document.getElementById('btnRetryWrong').addEventListener('click', () => {
      if (wrongProblems.length > 0) {
        playSoundEffect('pop');
        renderWorksheet([...wrongProblems]);
      }
    });
    document.getElementById('levelSelect').addEventListener('change', () => renderWorksheet());
    document.getElementById('opSelect').addEventListener('change', () => renderWorksheet());
    document.getElementById('countSelect').addEventListener('change', () => renderWorksheet());
    document.getElementById('titleCustom').addEventListener('input', (e) => {
      document.getElementById('displayTitle').innerText = e.target.value.trim() || '넘버블럭스 수학 교실';
    });

    // 펜 툴바 이벤트 바인딩
    document.getElementById('btnModePen').addEventListener('click', () => setInputMode('pen'));
    document.getElementById('btnModeKeyboard').addEventListener('click', () => setInputMode('keyboard'));

    document.getElementById('btnToolDraw').addEventListener('click', () => {
      penTool = 'draw';
      document.getElementById('btnToolDraw').classList.add('active');
      document.getElementById('btnToolEraser').classList.remove('active');
    });
    document.getElementById('btnToolEraser').addEventListener('click', () => {
      penTool = 'eraser';
      document.getElementById('btnToolEraser').classList.add('active');
      document.getElementById('btnToolDraw').classList.remove('active');
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        penColor = dot.dataset.color;
        penTool = 'draw';
        document.getElementById('btnToolDraw').classList.add('active');
        document.getElementById('btnToolEraser').classList.remove('active');
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        penSize = parseFloat(btn.dataset.size) || 4.5;
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    document.getElementById('btnScratchMode').addEventListener('click', (e) => {
      scratchModeActive = !scratchModeActive;
      e.currentTarget.classList.toggle('active', scratchModeActive);
      document.body.classList.toggle('scratch-active', scratchModeActive);
      playSoundEffect('pop');
    });

    document.getElementById('btnZoomPadToggle').addEventListener('click', (e) => {
      zoomPadEnabled = !zoomPadEnabled;
      e.currentTarget.classList.toggle('active', zoomPadEnabled);
      if (zoomPadEnabled) {
        const firstBox = document.querySelector('.answer-box');
        if (firstBox) openZoomPadForBox(firstBox);
      } else {
        document.getElementById('zoomPadModal').classList.remove('open');
      }
      playSoundEffect('pop');
    });

    document.getElementById('btnClearAllInk').addEventListener('click', clearAllHandwriting);

    // 크게 쓰기 모달 이벤트
    document.getElementById('btnZoomClear').addEventListener('click', () => {
      if (activeAnswerBox) clearAnswerBoxInk(activeAnswerBox);
    });
    document.getElementById('btnZoomClose').addEventListener('click', () => {
      document.getElementById('zoomPadModal').classList.remove('open');
    });

    // 크게 쓰기 캔버스 -> 활성 정답 칸 실시간 복제
    bindCanvasDrawing(document.getElementById('zoomPadCanvas'), {
      isZoomCanvas: true,
      onStroke: () => {
        if (!activeAnswerBox) return;
        const targetCanvas = activeAnswerBox.querySelector('.answer-canvas');
        const zoomCanvas = document.getElementById('zoomPadCanvas');
        if (targetCanvas && zoomCanvas) {
          const tCtx = targetCanvas.getContext('2d');
          tCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
          tCtx.drawImage(zoomCanvas, 0, 0, targetCanvas.width, targetCanvas.height);
          if (penTool !== 'eraser') {
            activeAnswerBox.dataset.hasInk = 'true';
            activeAnswerBox.classList.add('has-ink');
          }
        }
      }
    });

    // 이름 칸 캔버스 및 학습지 여백 캔버스 바인딩
    bindCanvasDrawing(document.getElementById('nameCanvas'));
    bindCanvasDrawing(document.getElementById('sheetScratchCanvas'), { onlyPenOrScratch: true });

    document.getElementById('btnTimer').addEventListener('click', toggleTimer);
    document.getElementById('btnSound').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      const btn = e.currentTarget;
      btn.classList.toggle('active', soundEnabled);
      document.getElementById('soundIcon').innerText = soundEnabled ? '🔊 효과음' : '🔇 음소거';
    });

    document.getElementById('themeSelect').addEventListener('change', (e) => {
      document.body.classList.remove('theme-warm', 'theme-eco');
      if (e.target.value === 'warm') document.body.classList.add('theme-warm');
      else if (e.target.value === 'eco') document.body.classList.add('theme-eco');
    });

    document.getElementById('btnPrint').addEventListener('click', () => window.print());

    const btnToggleAns = document.getElementById('btnToggleAns');
    btnToggleAns.addEventListener('click', () => {
      document.body.classList.toggle('show-answers');
      btnToggleAns.classList.toggle('active');
    });

    // 초기화
    initDate();
    populateSelectors();
    renderWorksheet();
  </script>
</body>
</html>
